# Sphinx для НАТИВНОГО локального запуска (пути под /tmp/sphinx).
# mkdir -p /tmp/sphinx/binlog && searchd --config docker/sphinx/sphinx.dev.conf
index testrt
{
    type = rt
    rt_mem_limit = 64M

    path = /tmp/sphinx/testrt

    rt_field = content
    rt_attr_string = user
    rt_attr_string = oid
    rt_attr_string = kind

    min_infix_len = 2
    morphology = stem_enru, Soundex, Metaphone
    expand_keywords = 1
    min_word_len = 3
}

searchd
{
    listen = 9312
    listen = 9306:mysql41
    log = /tmp/sphinx/searchd.log
    query_log = /tmp/sphinx/query.log
    pid_file = /tmp/sphinx/searchd.pid
    binlog_path = /tmp/sphinx/binlog
}
