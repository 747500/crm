# Sphinx rt-индекс для CRM (совпадает с README и middleware/doc/Search/*)
index testrt
{
    type = rt
    rt_mem_limit = 128M

    path = /var/lib/sphinxsearch/data/testrt

    rt_field = content
    rt_attr_string = user
    rt_attr_string = oid
    rt_attr_string = kind

    min_infix_len = 2
    morphology = stem_enru, Soundex, Metaphone
    expand_keywords = 1
    min_word_len = 3
}

searchd
{
    listen = 9312
    listen = 9306:mysql41
    log = /var/log/sphinxsearch/searchd.log
    query_log = /var/log/sphinxsearch/query.log
    pid_file = /var/run/sphinxsearch/searchd.pid
    binlog_path = /var/lib/sphinxsearch/data
}
